server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dhanpay-engine

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dhanpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: DhanPayHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 15000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

dhanpay:
  jwt:
    secret: ${JWT_SECRET:4d687a59324b706e5837725439714c35624e386d46326a51775a3476635870394b366852336d5738795432664e376251}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: dhanpay-engine
  transfer:
    default-currency: INR
    min-amount: 1.0000
    max-single-amount: 50000.0000
    daily-velocity-limit-amount: 200000.0000
    daily-velocity-max-count: 25
  idempotency:
    ttl-hours: 24
